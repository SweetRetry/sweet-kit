services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sweet_kit
      POSTGRES_PASSWORD: sweet
      POSTGRES_USER: sweet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweet -d sweet_kit"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sweet
      MINIO_ROOT_PASSWORD: sweetsweet
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
