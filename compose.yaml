services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sweet_kit
      POSTGRES_PASSWORD: sweet
      POSTGRES_USER: sweet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweet -d sweet_kit"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
